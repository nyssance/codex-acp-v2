name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: {}

jobs:
  ci:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.0
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck
      - name: Run unit tests
        run: bun run test
      - name: Build native smoke binary
        run: bun build src/index.ts --compile --outfile dist/codex-acp-smoke
      - name: Verify compiled stdio
        env:
          SMOKE_BINARY: dist/codex-acp-smoke${{ runner.os == 'Windows' && '.exe' || '' }}
        run: bun x vitest run src/__tests__/stdio.test.ts
      - name: Bundle binaries
        if: runner.os == 'Linux'
        run: bun run bundle:all
